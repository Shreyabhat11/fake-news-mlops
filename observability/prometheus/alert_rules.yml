# observability/prometheus/alert_rules.yml
# Alerting rules for the Fake News Drift Detector

groups:
  - name: fakenews_alerts
    rules:
      # Alert if API is down for 1 minute
      - alert: APIDown
        expr: up{job="fakenews_api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fake News API is DOWN"
          description: "The FastAPI inference service has been unreachable for 1 minute."

      # Alert if drift score exceeds warning threshold
      - alert: DriftWarning
        expr: fakenews_drift_score > 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Data drift warning detected"
          description: "Drift score {{ $value }} exceeds warning threshold 0.15."

      # Alert if drift score exceeds critical threshold
      - alert: DriftCritical
        expr: fakenews_drift_score > 0.30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical data drift — retraining required"
          description: "Drift score {{ $value }} exceeds critical threshold 0.30."

      # Alert if mean prediction confidence drops
      - alert: ConfidenceDegradation
        expr: histogram_quantile(0.50, fakenews_prediction_confidence_bucket) < 0.65
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Model confidence degradation"
          description: "Median prediction confidence dropped below 0.65."

      # Alert on high p95 latency
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, fakenews_inference_latency_seconds_bucket) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High inference latency"
          description: "P95 inference latency is {{ $value }}s (threshold: 1.0s)."
