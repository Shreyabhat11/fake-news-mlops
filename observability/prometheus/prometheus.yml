# observability/prometheus/prometheus.yml
# Prometheus scrape configuration for Fake News MLOps stack

global:
  scrape_interval:     15s   # How often to scrape
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout:      10s

# Alerting rules
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # FastAPI inference service metrics
  - job_name: 'fakenews_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MLflow server (if it exposes metrics)
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL exporter (optional)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres_exporter:9187']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # Add alertmanager:9093 if you set up Alertmanager
